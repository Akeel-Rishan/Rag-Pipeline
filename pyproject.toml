[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A Hybrid RAG Knowledge Assistant built incrementally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.18,<7", "fastembed>=0.7,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
